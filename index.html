<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4f46e5">
    <title>AnakCare - Smart Monitoring</title>
    
    <link id="pwa-manifest" rel="manifest" href="">

    <!-- Modern Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#4f46e5', secondary: '#10b981', dark: '#1e293b', surface: '#ffffff', background: '#f1f5f9' },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #cbd5e1; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overscroll-behavior-y: contain;
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .app-container {
            width: 100%; height: 100vh; max-width: 480px;
            background: #f1f5f9; position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden; display: flex; flex-direction: column;
        }

        @media (min-width: 481px) {
            .app-container { height: 90vh; border-radius: 32px; border: 8px solid #ffffff; box-shadow: 0 40px 60px -15px rgba(0,0,0,0.3); }
        }
        
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body>
    <div id="root" class="w-full max-w-[480px]"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Jadwal Default
        const createDefaultSchedule = (childId) => [
            { id: `act1_${childId}`, childId, title: 'Pulang Sekolah', time: 'Siang', icon: 'Home', reqPhoto: true, reqGps: true },
            { id: `act2_${childId}`, childId, title: 'Makan Siang', time: 'Siang', icon: 'Utensils', reqPhoto: true, reqGps: false },
            { id: `act3_${childId}`, childId, title: 'Istirahat / Main', time: 'Sore', icon: 'Gamepad2', reqPhoto: false, reqGps: false },
            { id: `act4_${childId}`, childId, title: 'Mandi & Bersiap', time: 'Sore', icon: 'Droplets', reqPhoto: true, reqGps: false },
            { id: `act5_${childId}`, childId, title: 'Makan Malam', time: 'Malam', icon: 'Utensils', reqPhoto: false, reqGps: false },
            { id: `act6_${childId}`, childId, title: 'Belajar Mandiri', time: 'Malam', icon: 'Book', reqPhoto: true, reqGps: false },
            { id: `act7_${childId}`, childId, title: 'Tidur Malam', time: 'Malam', icon: 'Moon', reqPhoto: true, reqGps: false }
        ];

        const Icon = ({ name, size = 24, className = '', color = 'currentColor' }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({
                        root: spanRef.current, icons: { [name]: window.lucide.icons[name] },
                        nameAttr: 'data-lucide', attrs: { width: size, height: size, stroke: color, 'stroke-width': 2.5 }
                    });
                }
            }, [name, size, className, color]);
            return <span ref={spanRef} className="inline-flex items-center justify-center"></span>;
        };

        const Toast = ({ message, type = 'info', onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const styles = { success: 'bg-emerald-100 text-emerald-800 border-emerald-200', error: 'bg-rose-100 text-rose-800 border-rose-200', info: 'bg-indigo-100 text-indigo-800 border-indigo-200' };
            const icons = { success: 'CheckCircle', error: 'AlertCircle', info: 'Info' };
            return (
                <div className="absolute top-6 left-1/2 transform -translate-x-1/2 z-[100] w-11/12 max-w-sm slide-up">
                    <div className={`p-4 rounded-2xl border shadow-xl flex items-center gap-3 ${styles[type]}`}>
                        <Icon name={icons[type]} size={20} />
                        <span className="font-bold text-sm flex-1">{message}</span>
                        <button onClick={onClose} className="p-1 opacity-60 hover:opacity-100"><Icon name="X" size={16} /></button>
                    </div>
                </div>
            );
        };

        const Modal = ({ isOpen, title, children, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-[80] flex items-end sm:items-center justify-center fade-in">
                    <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col slide-up max-h-[90vh]">
                        <div className="p-5 border-b flex justify-between items-center sticky top-0 bg-white z-10">
                            <h3 className="font-extrabold text-slate-800 text-lg">{title}</h3>
                            <button onClick={onClose} className="bg-slate-100 p-2 rounded-full hover:bg-slate-200 text-slate-500"><Icon name="X" size={18}/></button>
                        </div>
                        <div className="p-6 overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        const compressImage = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const scaleSize = 800 / img.width;
                    canvas.width = 800; canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
            };
            reader.onerror = reject;
        });

        const getGPS = () => new Promise((resolve) => {
            if (!navigator.geolocation) return resolve(null);
            navigator.geolocation.getCurrentPosition(
                pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                err => resolve(null), { enableHighAccuracy: true, timeout: 5000 }
            );
        });

        // ==================== SCREEN: LOGIN ====================
        const LoginScreen = ({ onLogin, users, showToast }) => {
            const [username, setUsername] = useState('');
            const [pin, setPin] = useState('');
            
            const handleLogin = (e) => {
                e.preventDefault();
                if(username === 'ortu' && pin === '1234') {
                    onLogin({ id: 'admin1', username: 'ortu', pin: '1234', role: 'ortu', name: 'Bunda / Ayah' });
                    return;
                }
                
                // FIXED BUG: Membandingkan string secara eksplisit & cek lowercase maupun camelCase
                const user = users.find(u => 
                    (u.username === username || u.Username === username) && 
                    String(u.pin || u.PIN) === String(pin)
                );
                
                if (user) onLogin(user);
                else showToast("Username atau PIN salah. (Default Ortu: ortu / 1234)", "error");
            };

            return (
                <div className="flex-1 flex flex-col items-center justify-center relative overflow-hidden h-full bg-slate-50">
                    {/* Abstract Background Elements */}
                    <div className="absolute top-[-10%] right-[-10%] w-80 h-80 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
                    <div className="absolute bottom-[-10%] left-[-10%] w-80 h-80 bg-emerald-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
                    
                    <div className="w-full max-w-sm px-6 z-10 slide-up">
                        <div className="text-center mb-10">
                            <div className="w-20 h-20 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-indigo-200 transform rotate-3">
                                <Icon name="Sparkles" size={40} color="white" />
                            </div>
                            <h1 className="text-4xl font-extrabold text-slate-800 tracking-tight">AnakCare</h1>
                            <p className="text-slate-500 mt-2 font-medium">Monitoring Pintar Harian Anak</p>
                        </div>
                        
                        <form onSubmit={handleLogin} className="glass-panel p-6 sm:p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 space-y-5">
                            <div>
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Username</label>
                                <div className="relative mt-1.5">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><Icon name="User" size={18}/></div>
                                    <input type="text" value={username} onChange={e=>setUsername(e.target.value.toLowerCase().replace(/\s/g,''))} 
                                        className="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-white/80 border border-slate-200 text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" 
                                        placeholder="Cth: ortu" required />
                                </div>
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">PIN Akses</label>
                                <div className="relative mt-1.5">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><Icon name="Lock" size={18}/></div>
                                    <input type="password" value={pin} onChange={e=>setPin(e.target.value)} 
                                        className="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-white/80 border border-slate-200 text-slate-800 font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-lg" 
                                        placeholder="••••" required />
                                </div>
                            </div>
                            <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-200 mt-8 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                                Masuk Sistem <Icon name="ArrowRight" size={18}/>
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==================== SCREEN: FORM LAPORAN ====================
        const ReportForm = ({ activity, onBack, onSubmit, showToast }) => {
            const [photo, setPhoto] = useState(null);
            const [notes, setNotes] = useState('');
            const [loading, setLoading] = useState(false);

            const handleCapture = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    try {
                        const compressed = await compressImage(file);
                        setPhoto(compressed);
                    } catch (err) { showToast("Gagal memproses foto", "error"); }
                }
            };

            const submit = () => {
                if (activity.reqPhoto && !photo) return showToast("Foto bukti wajib dilampirkan!", "error");
                setLoading(true);
                getGPS().then(loc => {
                    onSubmit({ activityId: activity.id || activity.ID, photo, gps: loc, notes, timestamp: new Date().toISOString() });
                });
            };

            return (
                <div className="flex-1 flex flex-col bg-slate-50 absolute inset-0 z-50 h-full slide-up">
                    <div className="bg-white px-5 py-4 flex items-center gap-4 shadow-sm sticky top-0 z-10">
                        <button onClick={onBack} disabled={loading} className="p-2 -ml-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors">
                            <Icon name="ArrowLeft" size={20} />
                        </button>
                        <div>
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Kirim Laporan</p>
                            <h2 className="font-extrabold text-slate-800 text-lg leading-tight">{activity.title || activity.Title}</h2>
                        </div>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-6 space-y-6">
                        {activity.reqPhoto && (
                            <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                                <label className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <div className="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs">1</div> 
                                    Ambil Foto Bukti
                                </label>
                                {photo ? (
                                    <div className="relative rounded-2xl overflow-hidden bg-slate-900 aspect-[4/3] flex items-center justify-center group shadow-inner">
                                        <img src={photo} className="max-h-full object-contain" alt="Bukti"/>
                                        <button onClick={() => setPhoto(null)} className="absolute top-3 right-3 w-10 h-10 flex items-center justify-center bg-rose-500/90 backdrop-blur-sm text-white rounded-full shadow-lg hover:bg-rose-600">
                                            <Icon name="Trash2" size={18} />
                                        </button>
                                    </div>
                                ) : (
                                    <label className="flex flex-col items-center justify-center w-full aspect-[4/3] border-2 border-dashed border-indigo-200 rounded-2xl cursor-pointer bg-indigo-50/50 hover:bg-indigo-50 transition-colors">
                                        <div className="w-16 h-16 bg-white shadow-sm text-indigo-600 rounded-full flex items-center justify-center mb-3">
                                            <Icon name="Camera" size={28} />
                                        </div>
                                        <span className="text-sm font-bold text-indigo-600">Buka Kamera</span>
                                        <span className="text-xs text-slate-400 mt-1">Wajib menyertakan foto</span>
                                        <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleCapture} />
                                    </label>
                                )}
                            </div>
                        )}
                        
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                            <label className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                <div className="w-6 h-6 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-xs">{activity.reqPhoto ? '2' : '1'}</div> 
                                Catatan Khusus <span className="text-xs text-slate-400 font-normal ml-auto">(Opsional)</span>
                            </label>
                            <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Tulis sesuatu tentang kegiatan ini..." 
                                className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm h-32 resize-none transition-all"></textarea>
                        </div>
                    </div>
                    
                    <div className="p-6 bg-white/80 backdrop-blur-md border-t border-slate-100 safe-area-bottom">
                        <button onClick={submit} disabled={loading} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 rounded-2xl shadow-lg shadow-indigo-200 flex justify-center items-center gap-2 active:scale-[0.98] transition-all disabled:opacity-70 disabled:cursor-not-allowed">
                            {loading ? <Icon name="Loader" className="animate-spin" /> : <Icon name="Send" />}
                            {loading ? 'MENYIMPAN DATA...' : 'KIRIM LAPORAN SEKARANG'}
                        </button>
                    </div>
                </div>
            );
        };

        // ==================== SCREEN: DASHBOARD ANAK ====================
        const ChildDashboard = ({ user, activities, reports, onLogout, saveReport, updateUser, showToast, isSyncing }) => {
            const [currentTab, setCurrentTab] = useState('beranda');
            const [selectedAct, setSelectedAct] = useState(null);
            
            // Handle Casing Aman
            const userId = user.id || user.ID;
            const mySchedule = activities.filter(a => String(a.childId || a.ChildID) === String(userId));
            const dateString = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });

            const handleReportSubmit = async (data) => {
                const success = await saveReport(data); 
                if(success) {
                    setSelectedAct(null); 
                    showToast("Mantap! Laporan terkirim \uD83C\uDF89", "success");
                }
            };

            const renderContent = () => {
                if (currentTab === 'beranda') {
                    const doneCount = mySchedule.filter(a => reports.some(r => String(r.activityId || r.JadwalID) === String(a.id || a.ID))).length;
                    const progress = mySchedule.length > 0 ? (doneCount / mySchedule.length) * 100 : 0;

                    return (
                        <div className="flex-1 overflow-y-auto pb-28 p-5 space-y-6 fade-in h-full">
                            {isSyncing && <div className="bg-indigo-50 text-indigo-600 text-xs font-bold text-center py-2 rounded-xl border border-indigo-100 flex items-center justify-center gap-2"><Icon name="RefreshCw" size={14} className="animate-spin"/> Menyinkronkan data...</div>}
                            
                            <div className="flex justify-between items-center px-1">
                                <div>
                                    <p className="text-sm font-bold text-slate-500 uppercase tracking-wide">{dateString}</p>
                                    <h1 className="text-2xl font-extrabold text-slate-800">Halo, {(user.name || user.Name || '').split(' ')[0]}! \uD83D\uDC4B</h1>
                                </div>
                                <div className="w-14 h-14 rounded-full overflow-hidden border-[3px] border-white shadow-md bg-slate-200">
                                    {user.photoProfile || user.PhotoProfile ? 
                                        <img src={user.photoProfile || user.PhotoProfile} className="w-full h-full object-cover"/> : 
                                        <div className="w-full h-full flex items-center justify-center bg-indigo-100 text-indigo-500"><Icon name="User" size={24}/></div>}
                                </div>
                            </div>

                            <div className="bg-gradient-to-br from-indigo-600 to-purple-600 rounded-[2rem] p-6 text-white shadow-xl shadow-indigo-200/50 relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl transform translate-x-1/2 -translate-y-1/2"></div>
                                <div className="flex justify-between items-center relative z-10 mb-4">
                                    <div>
                                        <h3 className="text-indigo-100 text-sm font-semibold mb-1">Misi Hari Ini</h3>
                                        <div className="text-4xl font-black flex items-baseline gap-1">
                                            {doneCount} <span className="text-xl text-indigo-200 font-medium">/ {mySchedule.length}</span>
                                        </div>
                                    </div>
                                    <div className="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-md border border-white/20">
                                        <Icon name="Target" size={28} className="text-yellow-300" />
                                    </div>
                                </div>
                                <div className="w-full bg-black/20 h-2.5 rounded-full overflow-hidden">
                                    <div className="bg-gradient-to-r from-emerald-400 to-emerald-300 h-full rounded-full transition-all duration-1000 ease-out" style={{ width: `${progress}%` }}></div>
                                </div>
                            </div>

                            <div>
                                <h3 className="font-extrabold text-slate-800 mb-4 text-sm uppercase tracking-widest flex items-center gap-2">
                                    <Icon name="ListTodo" size={16} className="text-indigo-500"/> Daftar Tugasmu
                                </h3>
                                <div className="grid gap-3">
                                    {mySchedule.map(act => {
                                        const isDone = reports.some(r => String(r.activityId || r.JadwalID) === String(act.id || act.ID));
                                        return (
                                            <div key={act.id || act.ID} onClick={() => !isDone && setSelectedAct(act)}
                                                className={`p-4 rounded-2xl border-2 transition-all flex items-center gap-4 ${isDone ? 'bg-slate-50 border-slate-100 opacity-70' : 'bg-white border-white shadow-sm hover:shadow-md hover:border-indigo-100 cursor-pointer active:scale-[0.98]'}`}>
                                                
                                                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 ${isDone ? 'bg-emerald-100 text-emerald-600' : 'bg-indigo-50 text-indigo-600'}`}>
                                                    <Icon name={isDone ? 'CheckCircle2' : (act.icon || act.Icon || 'Circle')} size={24} />
                                                </div>
                                                
                                                <div className="flex-1">
                                                    <h4 className={`font-bold text-base ${isDone ? 'text-slate-500 line-through' : 'text-slate-800'}`}>{act.title || act.Title}</h4>
                                                    <div className="flex items-center gap-2 mt-0.5 text-xs font-semibold text-slate-400">
                                                        <span className="flex items-center gap-1"><Icon name="Clock" size={12}/> {act.time || act.Time}</span>
                                                        {(act.reqPhoto || act.ReqPhoto) && !isDone && <span className="flex items-center gap-1 text-indigo-400 bg-indigo-50 px-1.5 py-0.5 rounded"><Icon name="Camera" size={10}/> Foto</span>}
                                                    </div>
                                                </div>

                                                <div className="shrink-0">
                                                    {isDone ? <div className="text-emerald-500"><Icon name="Check" size={20}/></div> : <div className="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center"><Icon name="ChevronRight" size={16}/></div>}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    );
                }
                
                if (currentTab === 'profil') {
                    return (
                        <div className="flex-1 overflow-y-auto pb-28 p-6 fade-in h-full bg-white">
                            <div className="flex flex-col items-center mt-6 mb-8">
                                <div className="w-24 h-24 rounded-full border-4 border-indigo-50 bg-slate-100 overflow-hidden mb-4 shadow-sm relative group">
                                    {user.photoProfile || user.PhotoProfile ? <img src={user.photoProfile || user.PhotoProfile} className="w-full h-full object-cover"/> : <div className="w-full h-full flex items-center justify-center text-slate-400"><Icon name="User" size={40}/></div>}
                                </div>
                                <h2 className="text-xl font-extrabold text-slate-800">{user.name || user.Name}</h2>
                                <p className="text-sm font-semibold text-slate-500 px-3 py-1 bg-slate-100 rounded-full mt-2 uppercase tracking-wider">{user.role || user.Role}</p>
                            </div>

                            <button onClick={onLogout} className="w-full bg-rose-50 text-rose-600 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 hover:bg-rose-100 transition-colors">
                                <Icon name="LogOut" size={20} /> Keluar Aplikasi
                            </button>
                        </div>
                    );
                }
            };

            return (
                <div className="flex-1 flex flex-col relative h-full">
                    {selectedAct ? <ReportForm activity={selectedAct} onBack={() => setSelectedAct(null)} onSubmit={handleReportSubmit} showToast={showToast} /> :
                        (<>
                            {renderContent()}
                            <div className="absolute bottom-6 left-6 right-6 bg-slate-900 rounded-[2rem] px-2 py-2 flex justify-between items-center z-40 shadow-2xl shadow-slate-400/30">
                                <button onClick={() => setCurrentTab('beranda')} className={`flex-1 flex flex-col items-center justify-center gap-1 py-3 rounded-[1.5rem] transition-all ${currentTab === 'beranda' ? 'bg-white/10 text-white' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="Home" size={22} /><span className="text-[10px] font-bold tracking-wider">BERANDA</span>
                                </button>
                                <button onClick={() => setCurrentTab('profil')} className={`flex-1 flex flex-col items-center justify-center gap-1 py-3 rounded-[1.5rem] transition-all ${currentTab === 'profil' ? 'bg-white/10 text-white' : 'text-slate-400 hover:text-white'}`}>
                                    <Icon name="User" size={22} /><span className="text-[10px] font-bold tracking-wider">PROFIL</span>
                                </button>
                            </div>
                        </>)}
                </div>
            );
        };

        // ==================== SCREEN: DASHBOARD ORTU ====================
        const ParentDashboard = ({ user, users, activities, reports, onLogout, addUser, showToast, isSyncing }) => {
            const [currentTab, setCurrentTab] = useState('dashboard');
            const [showAddModal, setShowAddModal] = useState(false);
            const [newChild, setNewChild] = useState({ name: '', user: '', pin: '' });
            const [selectedPhoto, setSelectedPhoto] = useState(null);
            
            const userId = user.id || user.ID;
            const childrenList = users.filter(u => (u.role || u.Role) === 'anak' && String(u.parentId || u.ParentID) === String(userId));
            const [selectedChildId, setSelectedChildId] = useState(childrenList[0]?.id || childrenList[0]?.ID || null);

            useEffect(() => { if (childrenList.length > 0 && !selectedChildId) setSelectedChildId(childrenList[0].id || childrenList[0].ID); }, [childrenList, selectedChildId]);

            const handleAddChild = async (e) => {
                e.preventDefault();
                if (users.find(u => String(u.username || u.Username) === newChild.user)) return showToast("Username sudah digunakan", "error");
                
                const childId = 'child_' + Date.now();
                await addUser({ id: childId, name: newChild.name, username: newChild.user, pin: newChild.pin, role: 'anak', parentId: userId });
                
                setShowAddModal(false); setNewChild({ name: '', user: '', pin: '' });
                setSelectedChildId(childId);
                showToast("Berhasil! Anak siap login dari HP nya.", "success");
            };

            const childActivities = activities.filter(a => String(a.childId || a.ChildID) === String(selectedChildId));
            const childReports = reports.filter(r => childActivities.some(a => String(a.id || a.ID) === String(r.activityId || r.JadwalID)));

            return (
                <div className="flex-1 flex flex-col h-full bg-slate-50 relative">
                    {/* Header Admin */}
                    <div className="bg-white px-6 py-5 flex justify-between items-center shadow-sm z-10 sticky top-0 border-b border-slate-100">
                        <div>
                            <p className="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mb-0.5">Admin Portal</p>
                            <h1 className="font-extrabold text-slate-800 text-xl">Monitor Anak</h1>
                        </div>
                        <div className="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600"><Icon name="ShieldCheck" size={20}/></div>
                    </div>

                    <div className="flex-1 overflow-y-auto pb-28 fade-in h-full">
                        {isSyncing && <div className="bg-indigo-500 text-white text-xs font-bold text-center py-1.5 flex justify-center gap-2 items-center"><Icon name="RefreshCw" size={12} className="animate-spin"/> Sinkronisasi Cloud...</div>}
                        
                        {currentTab === 'dashboard' && (
                            <div className="p-5">
                                {/* Child Selector */}
                                <div className="mb-6 flex gap-3 overflow-x-auto hide-scrollbar pb-2">
                                    {childrenList.map(child => {
                                        const cId = child.id || child.ID;
                                        const isSelected = String(selectedChildId) === String(cId);
                                        return (
                                        <button key={cId} onClick={() => setSelectedChildId(cId)}
                                            className={`flex-shrink-0 px-4 py-2.5 rounded-full border font-bold text-sm transition-all flex items-center gap-2 whitespace-nowrap
                                            ${isSelected ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200 border-indigo-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}>
                                            <div className={`w-6 h-6 rounded-full flex items-center justify-center overflow-hidden bg-white/20`}>
                                                {(child.photoProfile || child.PhotoProfile) ? <img src={child.photoProfile || child.PhotoProfile} className="w-full h-full object-cover"/> : <Icon name="User" size={12} className={isSelected ? 'text-white' : 'text-slate-400'}/>}
                                            </div>
                                            {(child.name || child.Name).split(' ')[0]}
                                        </button>
                                    )})}
                                    {childrenList.length === 0 && <div className="text-sm font-semibold text-slate-400 bg-white p-4 rounded-2xl border border-dashed border-slate-300 w-full text-center">Belum ada anak. Tambah di menu Setting.</div>}
                                </div>

                                {selectedChildId && (
                                    <div className="space-y-4 slide-up">
                                        <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm flex items-center justify-between">
                                            <div>
                                                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Status Laporan</p>
                                                <div className="text-3xl font-black text-slate-800 flex items-baseline gap-1">
                                                    {childReports.length} <span className="text-lg text-slate-400 font-medium">/ {childActivities.length}</span>
                                                </div>
                                            </div>
                                            <div className="w-16 h-16 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-500 border border-emerald-100">
                                                <Icon name="Activity" size={32} />
                                            </div>
                                        </div>

                                        <h3 className="font-extrabold text-slate-800 text-sm uppercase tracking-widest pt-4 mb-2 flex items-center gap-2"><Icon name="List" size={16} className="text-indigo-500"/> Timeline Hari Ini</h3>
                                        
                                        <div className="space-y-3">
                                            {childActivities.map(act => {
                                                const report = childReports.find(r => String(r.activityId || r.JadwalID) === String(act.id || act.ID));
                                                return (
                                                    <div key={act.id || act.ID} className="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 transition-all hover:shadow-md">
                                                        <div className="flex justify-between items-start mb-3">
                                                            <div className="flex gap-4 items-center">
                                                                <div className={`w-12 h-12 rounded-xl flex items-center justify-center shadow-inner ${report ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'}`}>
                                                                    <Icon name={act.icon || act.Icon || 'Circle'} size={24} />
                                                                </div>
                                                                <div>
                                                                    <h4 className="font-bold text-slate-800 text-base leading-tight mb-1">{act.title || act.Title}</h4>
                                                                    <p className="text-xs font-semibold text-slate-400 flex items-center gap-1"><Icon name="Clock" size={10}/> {act.time || act.Time}</p>
                                                                </div>
                                                            </div>
                                                            {report ? <span className="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-lg text-[10px] font-extrabold border border-emerald-100">SELESAI</span> : <span className="px-2.5 py-1 bg-slate-50 text-slate-400 rounded-lg text-[10px] font-extrabold border">BELUM</span>}
                                                        </div>
                                                        {report && (
                                                            <div className="bg-slate-50/50 p-3 rounded-xl border border-slate-100 flex gap-2">
                                                                {(report.photo || report.PhotoURL) && (
                                                                    <button onClick={() => setSelectedPhoto(report.photo || report.PhotoURL)} className="flex-1 bg-white border border-slate-200 py-2 rounded-lg text-xs font-bold text-slate-600 flex items-center justify-center gap-2 hover:border-indigo-300 hover:text-indigo-600 transition-colors">
                                                                        <Icon name="Image" size={14} className="text-indigo-400"/> Lihat Foto
                                                                    </button>
                                                                )}
                                                                {(report.notes || report.Notes) && (
                                                                    <div className="flex-1 bg-white border border-slate-200 py-2 px-3 rounded-lg text-[10px] font-medium text-slate-500 overflow-hidden text-ellipsis whitespace-nowrap">
                                                                        "{report.notes || report.Notes}"
                                                                    </div>
                                                                )}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {currentTab === 'galeri' && (
                            <div className="p-5 h-full">
                                <h2 className="font-extrabold text-slate-800 text-sm uppercase tracking-widest mb-5 flex items-center gap-2"><Icon name="Image" size={16} className="text-indigo-500"/> Galeri Foto</h2>
                                {selectedChildId ? (
                                    <div className="grid grid-cols-2 gap-4">
                                        {childReports.filter(r => r.photo || r.PhotoURL).map(report => {
                                            const photoSrc = report.photo || report.PhotoURL;
                                            return (
                                                <div key={report.id || report.ID} onClick={() => setSelectedPhoto(photoSrc)} className="relative aspect-square rounded-2xl overflow-hidden border border-slate-200 bg-slate-200 cursor-pointer shadow-sm hover:shadow-md transition-shadow group">
                                                    <img src={photoSrc} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"/>
                                                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent flex items-end p-3">
                                                        <p className="text-white text-xs font-bold truncate w-full flex items-center gap-1"><Icon name="Clock" size={10}/> {new Date(report.timestamp || report.Timestamp).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'})}</p>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                        {childReports.filter(r => r.photo || r.PhotoURL).length === 0 && (
                                            <div className="col-span-2 text-center mt-10 p-8 border-2 border-dashed border-slate-200 rounded-3xl">
                                                <Icon name="ImageOff" size={40} className="text-slate-300 mx-auto mb-3"/>
                                                <p className="text-sm font-semibold text-slate-500">Belum ada foto dilaporkan</p>
                                            </div>
                                        )}
                                    </div>
                                ) : <p className="text-sm font-semibold text-slate-500 text-center mt-10">Pilih anak di tab Monitor terlebih dahulu.</p>}
                            </div>
                        )}

                        {currentTab === 'pengaturan' && (
                            <div className="p-5 space-y-6">
                                <div className="bg-white border border-slate-100 rounded-[2rem] shadow-sm p-5">
                                    <div className="flex justify-between items-center mb-5">
                                        <h3 className="font-extrabold text-slate-800 text-sm uppercase tracking-widest">Akun Anak</h3>
                                        <button onClick={() => setShowAddModal(true)} className="text-xs font-bold text-white bg-indigo-600 px-4 py-2 rounded-xl flex items-center gap-1.5 hover:bg-indigo-700 transition-colors shadow-md shadow-indigo-200"><Icon name="Plus" size={14}/> Tambah</button>
                                    </div>
                                    <div className="divide-y divide-slate-100">
                                        {childrenList.map(child => (
                                            <div key={child.id || child.ID} className="py-4 flex items-center gap-4 first:pt-0 last:pb-0">
                                                <div className="w-12 h-12 rounded-2xl bg-indigo-50 flex items-center justify-center border border-indigo-100 overflow-hidden">
                                                    {(child.photoProfile || child.PhotoProfile) ? <img src={child.photoProfile || child.PhotoProfile} className="w-full h-full object-cover"/> : <Icon name="User" size={20} className="text-indigo-400"/>}
                                                </div>
                                                <div className="flex-1">
                                                    <p className="font-extrabold text-slate-800 text-sm">{child.name || child.Name}</p>
                                                    <p className="text-[11px] font-semibold text-slate-400 mt-0.5">User: {child.username || child.Username} <span className="mx-1">•</span> PIN: {child.pin || child.PIN}</p>
                                                </div>
                                            </div>
                                        ))}
                                        {childrenList.length === 0 && <div className="py-4 text-center text-sm font-semibold text-slate-400">Belum ada akun anak yang terdaftar.</div>}
                                    </div>
                                </div>

                                <button onClick={onLogout} className="w-full bg-rose-50 text-rose-600 font-extrabold py-4 rounded-2xl border border-rose-100 flex items-center justify-center gap-2 hover:bg-rose-100 transition-colors"><Icon name="LogOut" size={20} /> Keluar Admin</button>
                            </div>
                        )}
                    </div>

                    {/* Photo Viewer Modal */}
                    {selectedPhoto && (
                        <div className="absolute inset-0 bg-slate-900/95 z-[100] flex items-center justify-center p-4 fade-in backdrop-blur-sm" onClick={() => setSelectedPhoto(null)}>
                            <button className="absolute top-6 right-6 text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition-colors"><Icon name="X" size={24}/></button>
                            <img src={selectedPhoto} className="max-w-full max-h-[85vh] rounded-2xl object-contain shadow-2xl" onClick={e=>e.stopPropagation()}/>
                        </div>
                    )}

                    {/* Add Child Modal */}
                    <Modal isOpen={showAddModal} title="Tambah Akun Anak" onClose={() => setShowAddModal(false)}>
                        <form onSubmit={handleAddChild} className="space-y-5">
                            <div>
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Nama Panggilan</label>
                                <input type="text" value={newChild.name} onChange={e=>setNewChild({...newChild, name:e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 mt-1.5 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Contoh: Budi" required/>
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">Username Login</label>
                                <input type="text" value={newChild.user} onChange={e=>setNewChild({...newChild, user:e.target.value.toLowerCase().replace(/\s/g,'')})} className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 mt-1.5 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Tanpa spasi. Contoh: budi12" required/>
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-500 uppercase tracking-widest ml-1">PIN Akses</label>
                                <input type="number" value={newChild.pin} onChange={e=>setNewChild({...newChild, pin:e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 mt-1.5 font-bold tracking-widest text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="1234" required/>
                            </div>
                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 rounded-2xl mt-6 shadow-lg shadow-indigo-200 transition-colors">Simpan Akun Anak</button>
                        </form>
                    </Modal>

                    {/* Modern Bottom Navigation */}
                    <div className="absolute bottom-6 left-6 right-6 bg-white rounded-[2rem] px-2 py-2 flex justify-between items-center z-40 shadow-2xl shadow-slate-200/50 border border-slate-100">
                        <button onClick={() => setCurrentTab('dashboard')} className={`flex-1 flex flex-col items-center justify-center gap-1 py-3 rounded-[1.5rem] transition-all ${currentTab === 'dashboard' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:text-indigo-500'}`}><Icon name="LayoutDashboard" size={22}/><span className="text-[10px] font-bold tracking-wider">MONITOR</span></button>
                        <button onClick={() => setCurrentTab('galeri')} className={`flex-1 flex flex-col items-center justify-center gap-1 py-3 rounded-[1.5rem] transition-all ${currentTab === 'galeri' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:text-indigo-500'}`}><Icon name="Images" size={22}/><span className="text-[10px] font-bold tracking-wider">GALERI</span></button>
                        <button onClick={() => setCurrentTab('pengaturan')} className={`flex-1 flex flex-col items-center justify-center gap-1 py-3 rounded-[1.5rem] transition-all ${currentTab === 'pengaturan' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400 hover:text-indigo-500'}`}><Icon name="Settings" size={22}/><span className="text-[10px] font-bold tracking-wider">SETTING</span></button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [toast, setToast] = useState(null);
            const showToast = (message, type = 'info') => setToast({ message, type });

            // ⚠️ GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA! ⚠️
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_34MhC9b4a_dKh0QvIBU1cYBnNStUvec6M67X_8ZQYNqaNiJmefW8BBGAGPR5vcYF6Q/exec';

            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('anakcare_user_v2');
                return saved ? JSON.parse(saved) : null;
            });
            
            const [users, setUsers] = useState([]);
            const [activities, setActivities] = useState([]);
            const [reports, setReports] = useState([]);
            const [isLoadingDb, setIsLoadingDb] = useState(true);
            const [isSyncing, setIsSyncing] = useState(false);

            useEffect(() => {
                if (currentUser) localStorage.setItem('anakcare_user_v2', JSON.stringify(currentUser));
                else localStorage.removeItem('anakcare_user_v2');
            }, [currentUser]);

            const fetchData = async () => {
                setIsSyncing(true);
                try {
                    const [uRes, jRes, lRes] = await Promise.all([
                        fetch(`${SCRIPT_URL}?action=getUsers`).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?action=getJadwal`).then(r => r.json()),
                        fetch(`${SCRIPT_URL}?action=getLaporan`).then(r => r.json())
                    ]);
                    setUsers(uRes); setActivities(jRes); setReports(lRes);
                } catch (e) {
                    // Fallback jika tidak terkoneksi (Untuk keperluan preview awal)
                    if(users.length === 0) setUsers([{ id: 'admin1', username: 'ortu', pin: '1234', role: 'ortu', name: 'Ayah / Ibu' }]);
                } finally { setIsLoadingDb(false); setIsSyncing(false); }
            };

            useEffect(() => { fetchData(); }, []);

            const addReportToDb = async (reportData) => {
                const newReport = { id: 'rep_' + Date.now(), ...reportData, childId: currentUser.id || currentUser.ID };
                setReports(prev => [...prev, newReport]); 
                
                try {
                    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'addLaporan', ...newReport }) });
                    fetchData();
                    return true;
                } catch(e) {
                    showToast("Laporan tersimpan di HP, gagal ke Server", "error");
                    return false;
                }
            };

            const addUserToDb = async (userData) => {
                const defaultSchedules = createDefaultSchedule(userData.id);
                setUsers(prev => [...prev, userData]);
                setActivities(prev => [...prev, ...defaultSchedules]); 
                
                try {
                    // Eksekusi berurutan agar Google Sheets tidak "Lock" (Bentrokan data)
                    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'addUser', ...userData }) });
                    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'addJadwalList', jadwalList: defaultSchedules }) });
                    fetchData();
                } catch(e) { showToast("Data disimpan offline sementara", "info"); }
            };

            const updateUserInDb = async (userId, data) => {
                setUsers(prev => prev.map(u => String(u.id || u.ID) === String(userId) ? { ...u, ...data } : u));
                if (currentUser && String(currentUser.id || currentUser.ID) === String(userId)) {
                    setCurrentUser(prev => ({ ...prev, ...data }));
                }

                try {
                    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateUser', id: userId, ...data }) });
                    fetchData();
                } catch(e) { showToast("Data disimpan offline sementara", "info"); }
            };

            if (isLoadingDb) {
                return (
                    <div className="app-container flex flex-col items-center justify-center bg-slate-50">
                        <div className="relative w-20 h-20 mb-6">
                            <div className="absolute inset-0 bg-indigo-200 rounded-full animate-ping opacity-70"></div>
                            <div className="relative w-full h-full bg-indigo-600 rounded-full flex items-center justify-center shadow-lg shadow-indigo-200">
                                <Icon name="Activity" size={32} color="white" className="animate-pulse"/>
                            </div>
                        </div>
                        <h2 className="text-xl font-extrabold text-slate-800">Menyiapkan Aplikasi</h2>
                        <p className="text-slate-500 font-medium mt-2 text-sm">Menghubungkan ke server...</p>
                    </div>
                );
            }

            return (
                <div className="app-container">
                    {!currentUser ? (
                        <LoginScreen onLogin={u => setCurrentUser(u)} users={users} showToast={showToast} />
                    ) : String(currentUser.role || currentUser.Role).toLowerCase() === 'anak' ? (
                        <ChildDashboard user={currentUser} activities={activities} reports={reports} onLogout={() => setCurrentUser(null)} saveReport={addReportToDb} updateUser={updateUserInDb} showToast={showToast} isSyncing={isSyncing}/>
                    ) : (
                        <ParentDashboard user={currentUser} users={users} activities={activities} reports={reports} onLogout={() => setCurrentUser(null)} addUser={addUserToDb} showToast={showToast} isSyncing={isSyncing}/>
                    )}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
